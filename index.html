<!DOCTYPE html>
<html lang="ceb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanoy Gulle Family Tree</title>
    <!-- Import Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f8;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 100%;
            width: 95%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .form-box {
            background: #eef2f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 5px solid #27ae60;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .form-box h3 {
            margin-top: 0;
            color: #34495e;
        }
        .form-hint {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-bottom: 8px;
            display: block;
        }
        input, select, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .search-parent-box, .search-branch-box, .search-mobile-box {
            background-color: #fdfefe;
            border: 2px solid #3498db;
            font-weight: bold;
            color: #2980b9;
        }
        .btn-submit {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #219653;
        }
        .btn-cancel {
            background-color: #e74c3c;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: none;
            margin-top: 5px;
        }

        /* --- VIEW MODE SWITCHER --- */
        .view-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .view-switcher button {
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            width: auto;
            background: #e2e8f0;
            color: #475569;
        }
        .view-switcher button.active {
            background: #27ae60;
            color: white;
        }

        /* --- CONTROLS BAR --- */
        .tree-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .branch-filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 300px;
        }
        .branch-filter-group select {
            margin: 0;
            background: white;
            border: 2px solid #27ae60;
            font-weight: bold;
            color: #2c3e50;
        }
        .zoom-buttons {
            display: flex;
            gap: 5px;
            align-self: flex-end;
        }
        .zoom-buttons button {
            padding: 6px 12px;
            font-weight: bold;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            width: auto;
            margin: 0;
        }
        .zoom-buttons button:hover {
            background: #2980b9;
        }

        /* --- ZOOM & PAN VIEWPORT --- */
        .tree-viewport {
            width: 100%;
            height: 650px;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #fafafc;
            cursor: grab;
        }
        .tree-viewport:active {
            cursor: grabbing;
        }

        .tree-content {
            position: absolute;
            transform-origin: top center;
            transition: transform 0.1s ease-out;
            padding: 40px;
            display: inline-flex;
            justify-content: center;
        }

        /* --- MOBILE CARD LIST VIEW CONTAINER --- */
        .mobile-view-container {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .mobile-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-left: 5px solid #3498db;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .mobile-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mobile-name {
            font-weight: bold;
            font-size: 1.05em;
            color: #2c3e50;
        }
        .mobile-meta {
            font-size: 0.85em;
            color: #7f8c8d;
            margin-top: 4px;
        }
        .mobile-children-list {
            margin-top: 10px;
            padding-left: 20px;
            border-top: 1px solid #f1f5f9;
            padding-top: 8px;
        }

        /* --- TREE STRUCTURE WITH CONNECTING LINES --- */
        .tree {
            display: inline-flex;
            justify-content: center;
            padding-top: 20px;
        }
        .tree ul {
            padding-top: 20px; 
            position: relative;
            display: flex;
            justify-content: center;
            list-style-type: none;
            padding-left: 0;
            margin: 0;
        }
        .tree li {
            text-align: center;
            list-style-type: none;
            position: relative;
            padding: 20px 8px 0 8px;
        }
        .tree li::before, .tree li::after {
            content: '';
            position: absolute; 
            top: 0; 
            right: 50%;
            border-top: 2px solid #b2bec3;
            width: 50%; 
            height: 20px;
        }
        .tree li::after {
            right: auto; left: 50%;
            border-left: 2px solid #b2bec3;
        }
        .tree li:only-child::after, .tree li:only-child::before {
            display: none;
        }
        .tree li:only-child {
            padding-top: 0;
        }
        .tree li:first-child::before, .tree li:last-child::after {
            border: 0;
        }
        .tree li:last-child::before {
            border-right: 2px solid #b2bec3;
            border-radius: 0 5px 0 0;
        }
        .tree li:first-child::after {
            border-radius: 5px 0 0 0;
        }
        .tree ul ul::before {
            content: ''; 
            position: absolute; top: 0; left: 50%;
            border-left: 2px solid #b2bec3;
            width: 0; height: 20px;
        }

        /* --- COLOR CODED CARDS --- */
        .card {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.2s;
            min-width: 140px;
            max-width: 190px;
            background: white;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .gen-0 { background: #f39c12; color: white; border-color: #d68910; }
        .gen-1 { background: #3498db; color: white; border-color: #2980b9; }
        .gen-2 { background: #2ecc71; color: white; border-color: #27ae60; }
        .gen-3 { background: #9b59b6; color: white; border-color: #8e44ad; }
        .gen-4 { background: #e74c3c; color: white; border-color: #c0392b; }
        .gen-5 { background: #1abc9c; color: white; border-color: #16a085; }
        .gen-6 { background: #34495e; color: white; border-color: #2c3e50; }
        .partner-branch { background: #e67e22; color: white; border-color: #d35400; font-style: italic; }

        .name { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 2px; }
        .partner { font-size: 0.75em; opacity: 0.95; display: block; margin-top: 2px; }
        
        .card-actions {
            margin-top: 6px;
            display: flex;
            justify-content: center;
        }
        .card-actions button {
            padding: 3px 8px;
            font-size: 0.75em;
            width: auto;
            margin: 0;
            border-radius: 3px;
            cursor: pointer;
        }
        .btn-edit { background: #f1c40f; color: #2c3e50; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌳 Nanoy Gulle Family Tree</h1>
        
        <!-- Porma sa Pagdugang / Pag-edit og Sakop -->
        <div class="form-box">
            <h3 id="form-title">➕ Pagdugang og Bag-ong Kapamilya</h3>
            <form id="addForm">
                <input type="text" id="fullName" placeholder="Pangalan sa Anak o Sakop" required>
                <input type="text" id="partnerName" placeholder="Asawa/Bana (Kung naa kay kapares ang anak)">
                <input type="text" id="motherName" placeholder="Inahan / Asawa sa Ginikanan (Ex: Josing o Norma)">
                <input type="number" id="orderNum" placeholder="Pagka-sunodsunod (1 = Kamaguwangan, 2 = Sunod, etc.)" value="1" required>
                <span class="form-hint">💡 Ibutang ang saktong order aron mosunud sila gikan sa kamaguwangan ngadto sa kamanghuran.</span>
                
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
                
                <input type="text" id="searchParent" class="search-parent-box" placeholder="🔍 Pangitaa ang Ginikanan (I-type ang ngalan dinhi)...">
                
                <select id="parentId" required>
                    <option value="">-- Pilia ang Ginikanan --</option>
                </select>
                
                <button type="submit" class="btn-submit" id="submitBtn">I-save sa Punoan</button>
                <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">Kanselahon ang Pag-edit</button>
            </form>
        </div>

        <!-- VIEW MODE SWITCHER -->
        <div class="view-switcher">
            <button id="btnTreeView" class="active" onclick="switchView('tree')">🌳 Tree View (Computer)</button>
            <button id="btnMobileView" onclick="switchView('mobile')">📱 Mobile List View (Cellphone)</button>
        </div>

        <!-- CONTROLS: BRANCH FILTER + ZOOM -->
        <div class="tree-header-controls" id="controlsBar">
            <div class="branch-filter-group">
                <label style="font-weight: bold; color: #2c3e50; font-size: 0.9em;">🌿 Focus sa Sanga:</label>
                <input type="text" id="searchBranch" class="search-branch-box" placeholder="🔍 Pangitaa ang Sanga sa Tawo (I-type dinhi)..." style="margin: 0; padding: 8px;">
                <select id="filterBranch" onchange="onBranchFilterChange()">
                    <option value="">-- Tan-awa ang Tibuok Punoan (Tanan) --</option>
                </select>
            </div>
            <div class="zoom-buttons">
                <button onclick="zoomIn()">➕ Zoom In</button>
                <button onclick="zoomOut()">➖ Zoom Out</button>
                <button onclick="centerTree()">🎯 Center Tree</button>
                <button onclick="resetZoom()">🔄 Reset View</button>
            </div>
        </div>

        <!-- DESKTOP TREE VIEWPORT -->
        <div class="tree-viewport" id="treeViewport">
            <div class="tree-content" id="treeContent">
                <div class="tree" id="tree-container">
                    <p>Nag-load sa family tree...</p>
                </div>
            </div>
        </div>

        <!-- MOBILE CARD LIST VIEW -->
        <div class="mobile-view-container" id="mobileContainer">
            <input type="text" id="searchMobile" class="search-mobile-box" placeholder="🔍 Pangitaa ang ngalan sa listahan..." style="margin-bottom: 15px; padding: 10px;">
            <div id="mobileListContent">
                <p>Nag-load sa mobile list...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cmtncehdfgccgwkldvky.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_RCEL4rmgoq9P2Qk5QdbyNw_5jXDwbTS';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allMembers = [];
        let editingId = null;
        let currentViewMode = 'tree'; // 'tree' or 'mobile'

        // ZOOM & PAN STATE VARIABLES
        let currentScale = 0.5;
        let translateX = 0;
        let translateY = 30;
        let isDragging = false;
        let startX, startY;

        const viewport = document.getElementById('treeViewport');
        const content = document.getElementById('treeContent');

        function switchView(mode) {
            currentViewMode = mode;
            const treeViewport = document.getElementById('treeViewport');
            const mobileContainer = document.getElementById('mobileContainer');
            const controlsBar = document.getElementById('controlsBar');
            const btnTree = document.getElementById('btnTreeView');
            const btnMobile = document.getElementById('btnMobileView');

            if (mode === 'tree') {
                treeViewport.style.display = 'block';
                controlsBar.style.display = 'flex';
                mobileContainer.style.display = 'none';
                btnTree.classList.add('active');
                btnMobile.classList.remove('active');
                setTimeout(() => centerTree(), 50);
            } else {
                treeViewport.style.display = 'none';
                controlsBar.style.display = 'none';
                mobileContainer.style.display = 'block';
                btnMobile.classList.add('active');
                btnTree.classList.remove('active');
                renderMobileList(allMembers);
            }
        }

        function updateTransform() {
            content.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
        }

        function centerTree() {
            if (!viewport || !content) return;
            const viewportWidth = viewport.clientWidth;
            const contentWidth = content.scrollWidth;
            translateX = (viewportWidth - (contentWidth * currentScale)) / 2;
            translateY = 30;
            updateTransform();
        }

        function zoomIn() {
            currentScale = Math.min(currentScale + 0.15, 2.0);
            updateTransform();
        }

        function zoomOut() {
            currentScale = Math.max(currentScale - 0.15, 0.15);
            updateTransform();
        }

        function resetZoom() {
            currentScale = 0.5;
            centerTree();
        }

        // Mouse Drag / Pan Logic
        viewport.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Mouse Wheel Zoom
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        }, { passive: false });


        async function fetchFamilyData() {
            const { data, error } = await supabaseClient
                .from('family_members')
                .select('*')
                .order('generation_level', { ascending: true })
                .order('order', { ascending: true }); 

            if (error) {
                console.error('Error:', error);
                document.getElementById('tree-container').innerHTML = '<p style="color:red;">Wala magamit ang database connection.</p>';
                return;
            }

            allMembers = data;
            populateParentDropdown(allMembers, '');
            populateBranchFilterDropdown(allMembers, '');
            renderTree(data);
            renderMobileList(allMembers);
            
            setTimeout(() => {
                centerTree();
            }, 100);
        }

        function populateBranchFilterDropdown(data, filterText = '') {
            const select = document.getElementById('filterBranch');
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- Tan-awa ang Tibuok Punoan (Tanan) --</option>';
            
            data.forEach(m => {
                const displayName = `${m.full_name} ${m.partner_name ? '(♡ ' + m.partner_name + ')' : ''} [Gen ${m.generation_level}]`;
                if (filterText === '' || displayName.toLowerCase().includes(filterText.toLowerCase())) {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = displayName;
                    select.appendChild(opt);
                }
            });
            if (currentVal && Array.from(select.options).some(opt => opt.value === currentVal)) {
                select.value = currentVal;
            }
        }

        document.getElementById('searchBranch').addEventListener('input', (e) => {
            populateBranchFilterDropdown(allMembers, e.target.value);
        });

        function onBranchFilterChange() {
            const selectedId = document.getElementById('filterBranch').value;
            if (!selectedId) {
                renderTree(allMembers);
                renderMobileList(allMembers);
            } else {
                const targetIds = getDescendantIds(selectedId, allMembers);
                const filtered = allMembers.filter(m => targetIds.has(m.id));
                renderTree(filtered, selectedId);
                renderMobileList(filtered);
            }
            setTimeout(() => centerTree(), 100);
        }

        function getDescendantIds(rootId, members) {
            let ids = new Set([rootId]);
            let queue = [rootId];
            while (queue.length > 0) {
                let curr = queue.shift();
                let children = members.filter(m => m.parent_id === curr);
                for (let child of children) {
                    if (!ids.has(child.id)) {
                        ids.add(child.id);
                        queue.push(child.id);
                    }
                }
            }
            return ids;
        }

        function populateParentDropdown(data, filterText = '') {
            const select = document.getElementById('parentId');
            const currentVal = select.value;
            select.innerHTML = '<option value="">-- Pilia ang Ginikanan --</option>';
            
            data.forEach(m => {
                const displayName = `${m.full_name} ${m.partner_name ? '(Asawa: ' + m.partner_name + ')' : ''}`;
                if (filterText === '' || displayName.toLowerCase().includes(filterText.toLowerCase())) {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    opt.textContent = displayName;
                    select.appendChild(opt);
                }
            });

            if (currentVal && Array.from(select.options).some(opt => opt.value === currentVal)) {
                select.value = currentVal;
            }
        }

        document.getElementById('searchParent').addEventListener('input', (e) => {
            populateParentDropdown(allMembers, e.target.value);
        });

        // Mobile List View Renderer
        function renderMobileList(members, filterText = '') {
            const container = document.getElementById('mobileListContent');
            const map = {};
            const roots = [];

            members.forEach(m => {
                map[m.id] = { ...m, children: [] };
            });

            members.forEach(m => {
                if (m.parent_id && map[m.parent_id]) {
                    map[m.parent_id].children.push(map[m.id]);
                } else {
                    roots.push(map[m.id]);
                }
            });

            function buildMobileHtml(nodes) {
                if (nodes.length === 0) return '';
                let html = '';
                nodes.forEach(node => {
                    const fullName = node.full_name;
                    if (filterText === '' || fullName.toLowerCase().includes(filterText.toLowerCase()) || (node.partner_name && node.partner_name.toLowerCase().includes(filterText.toLowerCase()))) {
                        html += `<div class="mobile-card">
                            <div class="mobile-card-header">
                                <div>
                                    <span class="mobile-name">👤 ${fullName}</span>
                                    ${node.partner_name ? `<div class="mobile-meta">♡ Asawa/Bana: ${node.partner_name}</div>` : ''}
                                    ${node.mother_name ? `<div class="mobile-meta">母亲 Inahan: ${node.mother_name}</div>` : ''}
                                    <div class="mobile-meta">Henerasyon: ${node.generation_level} | Order: ${node.order || 1}</div>
                                </div>
                                <button class="btn-edit" onclick="startEdit('${node.id}')" style="padding: 5px 10px; font-size: 0.8em;">✏️ Edit</button>
                            </div>`;
                        if (node.children && node.children.length > 0) {
                            html += `<div class="mobile-children-list"><small style="font-weight:bold; color:#27ae60;">Mga Anak (${node.children.length}):</small>`;
                            html += buildMobileHtml(node.children);
                            html += `</div>`;
                        }
                        html += `</div>`;
                    } else if (node.children && node.children.length > 0) {
                        // Kung wala mag-match ang ginikanan pero naay match sa ilahang mga anak
                        let childHtml = buildMobileHtml(node.children);
                        if (childHtml !== '') {
                            html += `<div class="mobile-card">
                                <div class="mobile-card-header">
                                    <div>
                                        <span class="mobile-name">👤 ${fullName}</span>
                                        ${node.partner_name ? `<div class="mobile-meta">♡ Asawa/Bana: ${node.partner_name}</div>` : ''}
                                    </div>
                                    <button class="btn-edit" onclick="startEdit('${node.id}')" style="padding: 5px 10px; font-size: 0.8em;">✏️ Edit</button>
                                </div>
                                <div class="mobile-children-list">${childHtml}</div>
                            </div>`;
                        }
                    }
                });
                return html;
            }

            container.innerHTML = buildMobileHtml(roots) || '<p style="text-align:center; color:#7f8c8d;">Walay nakit-an nga ngalan.</p>';
        }

        document.getElementById('searchMobile').addEventListener('input', (e) => {
            renderMobileList(allMembers, e.target.value);
        });

        function renderTree(members, focusRootId = null) {
            const container = document.getElementById('tree-container');
            const map = {};
            const roots = [];

            members.forEach(m => {
                map[m.id] = { ...m, children: [] };
            });

            members.forEach(m => {
                if (m.parent_id && map[m.parent_id] && (!focusRootId || m.id !== focusRootId)) {
                    map[m.parent_id].children.push(map[m.id]);
                } else {
                    roots.push(map[m.id]);
                }
            });

            Object.values(map).forEach(parent => {
                if (parent.children && parent.children.length > 0) {
                    parent.children.sort((a, b) => (a.order || 99) - (b.order || 99));

                    const partnersWithChildren = {};
                    const unassignedChildren = [];

                    parent.children.forEach(child => {
                        const mother = child.mother_name ? child.mother_name.trim() : null;
                        if (mother) {
                            if (!partnersWithChildren[mother]) {
                                partnersWithChildren[mother] = [];
                            }
                            partnersWithChildren[mother].push(child);
                        } else {
                            unassignedChildren.push(child);
                        }
                    });

                    const partnerNames = Object.keys(partnersWithChildren);
                    if (partnerNames.length > 0) {
                        let newChildren = [];
                        
                        partnerNames.forEach(partnerName => {
                            const virtualPartnerId = `partner-${parent.id}-${partnerName}`;
                            const partnerNode = {
                                id: virtualPartnerId,
                                full_name: `Asawa: ${partnerName}`,
                                partner_name: null,
                                generation_level: parent.generation_level + 1,
                                is_virtual_partner: true,
                                children: partnersWithChildren[partnerName]
                            };
                            newChildren.push(partnerNode);
                        });

                        if (unassignedChildren.length > 0) {
                            newChildren = newChildren.concat(unassignedChildren);
                        }

                        parent.children = newChildren;
                    }
                }
            });

            function buildHtmlTree(nodes) {
                if (nodes.length === 0) return '';
                let html = '<ul>';
                nodes.forEach(node => {
                    if (node.is_virtual_partner) {
                        html += `<li>
                            <div class="card partner-branch">
                                <span class="name">♡ ${node.full_name}</span>
                            </div>`;
                        if (node.children && node.children.length > 0) {
                            html += buildHtmlTree(node.children);
                        }
                        html += `</li>`;
                    } else {
                        const partnerStr = node.partner_name ? `<span class="partner">♡ ${node.partner_name}</span>` : '';
                        let genClass = `gen-${node.generation_level}`;
                        if (node.generation_level > 6) genClass = 'gen-6';

                        html += `<li>
                            <div class="card ${genClass}">
                                <span class="name">${node.full_name}</span>
                                ${partnerStr}
                                <div class="card-actions">
                                    <button class="btn-edit" onclick="startEdit('${node.id}')">✏️ Edit</button>
                                </div>
                            </div>`;
                        if (node.children && node.children.length > 0) {
                            html += buildHtmlTree(node.children);
                        }
                        html += `</li>`;
                    }
                });
                html += '</ul>';
                return html;
            }

            container.innerHTML = buildHtmlTree(roots);
        }

        function startEdit(id) {
            const member = allMembers.find(m => m.id === id);
            if (!member) return;

            editingId = id;
            document.getElementById('fullName').value = member.full_name;
            document.getElementById('partnerName').value = member.partner_name || '';
            document.getElementById('motherName').value = member.mother_name || '';
            document.getElementById('orderNum').value = member.order || 1;
            
            document.getElementById('searchParent').value = '';
            populateParentDropdown(allMembers, '');
            document.getElementById('parentId').value = member.parent_id || '';

            document.getElementById('form-title').textContent = `✏️ Pag-usab sa Impormasyon: ${member.full_name}`;
            document.getElementById('submitBtn').textContent = 'I-update ang Punoan';
            document.getElementById('cancelBtn').style.display = 'block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.resetForm = function() {
            editingId = null;
            document.getElementById('addForm').reset();
            
            document.getElementById('searchParent').value = '';
            populateParentDropdown(allMembers, '');

            document.getElementById('form-title').textContent = `➕ Pagdugang og Bag-ong Kapamilya`;
            document.getElementById('submitBtn').textContent = 'I-save sa Punoan';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const partnerName = document.getElementById('partnerName').value;
            const motherName = document.getElementById('motherName').value;
            const orderNum = parseInt(document.getElementById('orderNum').value) || 1;
            const parentId = document.getElementById('parentId').value;

            if (editingId) {
                const { error } = await supabaseClient
                    .from('family_members')
                    .update({
                        full_name: fullName,
                        partner_name: partnerName ? partnerName : null,
                        mother_name: motherName ? motherName : null,
                        order: orderNum,
                        parent_id: parentId
                    })
                    .eq('id', editingId);

                if (error) {
                    alert('Error sa pag-update: ' + error.message);
                } else {
                    alert('Nalampuson nga na-update ang impormasyon!');
                    resetForm();
                    fetchFamilyData();
                }
            } else {
                const parent = allMembers.find(m => m.id === parentId);
                const nextGen = parent ? (parent.generation_level + 1) : 1;
                const newId = crypto.randomUUID();

                const { error } = await supabaseClient
                    .from('family_members')
                    .insert([
                        {
                            id: newId,
                            full_name: fullName,
                            partner_name: partnerName ? partnerName : null,
                            mother_name: motherName ? motherName : null,
                            order: orderNum,
                            parent_id: parentId,
                            generation_level: nextGen,
                            is_deceased: false
                        }
                    ]);

                if (error) {
                    alert('Wala na-save: ' + error.message);
                } else {
                    alert('Nalampuson nga nadugang sa pamilya!');
                    document.getElementById('addForm').reset();
                    resetForm();
                    fetchFamilyData();
                }
            }
        });

        fetchFamilyData();
    </script>
</body>
</html>
